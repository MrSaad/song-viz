      const dx = CX - p.x, dy = CY - p.y, d = Math.hypot(dx, dy) + 1e-3, acc = 2800 * S;

      if (d < 160 * S) { p.life = 0; coreKick = Math.min(1, coreKick + 0.006); continue; }
    }
    const k = Math.pow(p.drag, dt);
    p.vx *= k; p.vy *= k; p.vy += p.g * dt;
    p.x += p.vx * dt; p.y += p.vy * dt;
    const fade = Math.min(1, p.life / (p.max * 0.5)) * Math.min(1, (p.max - p.life) * 12 + 0.3);
    const a = p.a * fade;
    if (p.streak) {
      g.strokeStyle = hsl(p.h, p.s, p.l, a);
      g.lineWidth = p.size;
      g.beginPath(); g.moveTo(p.x - p.vx * p.streak, p.y - p.vy * p.streak); g.lineTo(p.x, p.y); g.stroke();
    } else {
      dot(g, p.x, p.y, p.size * 2.5, p.h, p.s, p.l, a);
    }
  }
}

// ===== drawing: one function per story element =====
function drawSky(g, t, b) {
  const lift = 1 + 0.25 * b.pump * track(TR.blood, t) + 0.1 * b.pump;
  const gr = g.createLinearGradient(0, 0, 0, H);
  gr.addColorStop(0, rgb(pal.top.map(v => v * lift)));
  gr.addColorStop(1, rgb(pal.bot.map(v => v * lift)));
  g.globalCompositeOperation = 'source-over'; g.globalAlpha = 1;
  g.fillStyle = gr; g.fillRect(0, 0, W, H);
}

function drawStars(g, t, v) {
  if (v < 0.01) return;
  g.globalCompositeOperation = 'lighter';
  const tw = env(TREB, t);
  for (const s of STARS) {
    const a = v * (0.25 + 0.55 * (0.5 + 0.5 * Math.sin(u * s.sp + s.ph))) * (0.7 + 0.5 * tw);
    dot(g, s.x * W, s.y * H, s.r * 2.4 * S, 220, 30, 85, a);
  }
}

function drawDust(g, du, t, energy, blood) {
  g.globalCompositeOperation = 'lighter';
  const speed = (14 + 50 * energy + 110 * blood) * S;
  const rise = (blood * 50 + 10) * S;
  for (const d of DUST) {
    const ang = noise2(d.x / (260 * S), d.y / (260 * S) + u * 0.04) * TAU * 1.4;
    d.x += Math.cos(ang) * speed * d.z * du;
    d.y += (Math.sin(ang) * speed * d.z - rise * d.z) * du;
    if (d.x < -20) d.x += W + 40; if (d.x > W + 20) d.x -= W + 40;
    if (d.y < -20) d.y += H + 40; if (d.y > H + 20) d.y -= H + 40;
    const a = (0.12 + 0.18 * d.z) * (0.6 + 0.4 * Math.sin(u * 2 + d.ph));
    dot(g, d.x, d.y, (2 + 3 * d.z) * S, blood > 0.4 ? 10 : pal.hue, Math.max(30, pal.sat), 65, a);
  }
}

function drawRays(g, t, v) {
  if (v < 0.01) return;
  g.globalCompositeOperation = 'lighter';
  const ox = CX, oy = -220 * S, len = H + 500 * S, m = env(MID, t);
  for (let i = 0; i < 7; i++) {
    const a = (i - 3) * 0.085 + 0.025 * Math.sin(u * 0.4 + i * 1.7);
    const w = 0.022 + 0.01 * Math.sin(u * 0.7 + i);
    const al = v * (0.09 + 0.05 * Math.sin(u * 1.3 + i * 2.1)) * (0.6 + 0.6 * m);
    const gr = g.createLinearGradient(ox, oy, ox, oy + len);
    gr.addColorStop(0, hsl(45, 70, 80, 0)); gr.addColorStop(0.35, hsl(45, 70, 78, al)); gr.addColorStop(1, hsl(40, 60, 60, 0));
    g.fillStyle = gr;
    g.beginPath(); g.moveTo(ox, oy);
    g.lineTo(ox + Math.sin(a - w) * len, oy + Math.cos(a - w) * len);
    g.lineTo(ox + Math.sin(a + w) * len, oy + Math.cos(a + w) * len);
    g.closePath(); g.fill();
  }
}

function drawMoon(g, t, v, b) {
  if (v < 0.01) return;
  const m = L.moon;
  g.globalCompositeOperation = 'lighter';
  dot(g, m.x, m.y, m.r * 8, 215, 50, 64, v * 0.32 * (1 + 0.3 * b.pump));
  dot(g, m.x, m.y, m.r * 2.6, 210, 40, 80, v * 0.45);
  g.globalCompositeOperation = 'source-over';
  const gr = g.createRadialGradient(m.x - m.r * 0.3, m.y - m.r * 0.3, m.r * 0.1, m.x, m.y, m.r);
  gr.addColorStop(0, `rgba(242,245,255,${v})`); gr.addColorStop(1, `rgba(185,196,224,${v})`);
  g.fillStyle = gr; g.beginPath(); g.arc(m.x, m.y, m.r, 0, TAU); g.fill();
  g.fillStyle = `rgba(110,122,156,${v * 0.28})`;
  for (const [dx, dy, rr] of MARIA) { g.beginPath(); g.arc(m.x + dx * m.r, m.y + dy * m.r, rr * m.r, 0, TAU); g.fill(); }
}

function drawWindow(g, v) {
  if (v < 0.01) return;
  const w = L.win, fy = w.y + w.hh;
  g.globalCompositeOperation = 'lighter';
  const gr = g.createLinearGradient(0, fy, 0, fy + 280 * S);
  gr.addColorStop(0, hsl(215, 40, 70, 0.09 * v)); gr.addColorStop(1, hsl(215, 40, 70, 0));
  g.fillStyle = gr;
  g.beginPath(); g.moveTo(w.x - w.hw, fy); g.lineTo(w.x + w.hw, fy); g.lineTo(w.x + w.hw * 1.7, fy + 280 * S); g.lineTo(w.x - w.hw * 1.7, fy + 280 * S); g.fill();
  g.strokeStyle = hsl(215, 35, 75, 0.5 * v); g.lineWidth = 2.2 * S;
  g.strokeRect(w.x - w.hw, w.y - w.hh, w.hw * 2, w.hh * 2);
  g.strokeStyle = hsl(215, 35, 75, 0.2 * v); g.lineWidth = 1 * S;
  g.strokeRect(w.x - w.hw - 12 * S, w.y - w.hh - 12 * S, w.hw * 2 + 24 * S, w.hh * 2 + 24 * S);
  g.beginPath(); g.moveTo(w.x - w.hw - 34 * S, fy + 16 * S); g.lineTo(w.x + w.hw + 34 * S, fy + 16 * S); g.stroke();
}

// the window's cross: pulled off the wall into the child's hands, back on the wall at the end
function drawCross(g, t) {
  const w = L.win, winV = track(TR.window, t);
  let c;
  if (t > 150) c = { x: w.x, y: w.y, hw: w.hw, up: w.hh, dn: w.hh, rot: 0, hue: 215, sat: 35, l: 72, a: winV * 0.8, lw: 2 * S, glow: 0 };
  else {
    const fall = smooth(25.4, 27.6, t), gold = smooth(24.0, 24.6, t);
    const tx = L.child[0] - 4 * S, ty = L.child[1] - 44 * S;
    c = {
      x: lerp(w.x, tx, fall), y: lerp(w.y, ty, fall * fall),
      hw: lerp(w.hw, 20 * S, fall), up: lerp(w.hh, 24 * S, fall), dn: lerp(w.hh, 50 * S, fall),
      rot: Math.sin(fall * Math.PI) * 0.7,
      hue: lerpHue(215, 45, gold), sat: lerp(35, 80, gold), l: lerp(72, 70, gold),
      a: t < 24 ? winV * 0.8 : track(TR.crossA, t), lw: lerp(2, 3.2, fall) * S,
      glow: swell(t, 24.16, 0.25, 1.4) + track(TR.rays, t) * 0.5,
    };
  }
  if (c.a < 0.01) return;
  g.save(); g.translate(c.x, c.y); g.rotate(c.rot);
  g.globalCompositeOperation = 'lighter'; g.lineCap = 'round';
  const path = () => { g.beginPath(); g.moveTo(-c.hw, 0); g.lineTo(c.hw, 0); g.moveTo(0, -c.up); g.lineTo(0, c.dn); };
  g.strokeStyle = hsl(c.hue, c.sat, c.l, c.a * 0.2 * (1 + c.glow)); g.lineWidth = c.lw * 5; path(); g.stroke();
  g.strokeStyle = hsl(c.hue, c.sat, c.l + 12, c.a); g.lineWidth = c.lw; path(); g.stroke();
  g.restore();
  if (c.glow > 0.02) dot(g, c.x, c.y, (60 + 140 * (1 - smooth(25.4, 27.6, t))) * S, c.hue, c.sat, 70, c.a * c.glow * 0.5);
}

function drawRecord(g, t, b, v, blood) {
  if (v < 0.01) return;
  const R = (205 + 40 * blood) * S * (1 + 0.07 * b.pump * blood + 0.05 * coreKick) * (1 + 0.04 * env(BASS, t) * blood);
  const hue = lerpHue(220, pal.hue, Math.max(blood, 0.3)), sat = lerp(25, pal.sat, blood);
  g.globalCompositeOperation = 'lighter';
  if (blood > 0.01) dot(g, CX, CY, R * 2.6, pal.hue, pal.sat, 45, blood * (0.35 + 0.4 * b.pump + 0.5 * coreKick));
  const N = 24;
  for (let k = 0; k < N; k++) {
    const f = k / (N - 1), r = R * (0.34 + 0.66 * f);
    const wave = Math.exp(-Math.pow(f - b.since * 1.7, 2) * 45) * (0.3 + blood);
    g.strokeStyle = hsl(hue, sat, 50 + 25 * wave, v * (0.12 + 0.55 * wave + (k % 4 === 0 ? 0.08 : 0)));
    g.lineWidth = (k % 6 === 0 ? 1.8 : 0.9) * S;
    g.beginPath(); g.arc(CX, CY, r, 0, TAU); g.stroke();
  }
  // static sheen (the grooves turn underneath it)
  g.lineWidth = 2.2 * S;
  for (let k = 0; k < N; k += 2) {
    const r = R * (0.34 + 0.66 * k / (N - 1)), s0 = -0.9 + 0.05 * Math.sin(u * 0.5);
    g.strokeStyle = hsl(hue, sat * 0.5, 88, v * 0.1);
    g.beginPath(); g.arc(CX, CY, r, s0, s0 + 0.5); g.stroke();
    g.beginPath(); g.arc(CX, CY, r, s0 + Math.PI, s0 + Math.PI + 0.5); g.stroke();
  }
  // label, rotating
  g.save(); g.translate(CX, CY); g.rotate(recRot);
  g.globalCompositeOperation = 'source-over';
  g.fillStyle = hsl(pal.hue, pal.sat * 0.9, 18 + 22 * blood + 10 * b.pump * blood, v * 0.85);
  g.beginPath(); g.arc(0, 0, R * 0.3, 0, TAU); g.fill();
  g.globalCompositeOperation = 'lighter';
  g.strokeStyle = hsl(pal.hue, pal.sat * 0.6, 75, v * 0.45); g.lineWidth = 1.4 * S;
  g.beginPath(); g.arc(0, 0, R * 0.22, -0.4, 1.1); g.stroke();
  g.beginPath(); g.arc(0, 0, R * 0.17, 2.4, 3.6); g.stroke();
  g.fillStyle = `rgba(0,0,0,${v * 0.8})`;
  g.globalCompositeOperation = 'source-over';
  g.beginPath(); g.arc(0, 0, 5 * S, 0, TAU); g.fill();
  const br = track(TR.broken, t);
  if (br > 0.01) {
    g.globalCompositeOperation = 'lighter';
    g.strokeStyle = hsl(0, 20, 92, br * v * (0.6 + 0.4 * b.pump)); g.lineWidth = 2 * S;
    g.beginPath();
    RCRACK.forEach(([r, a], i) => { const x = Math.cos(1 + a) * r * R, y = Math.sin(1 + a) * r * R; i ? g.lineTo(x, y) : g.moveTo(x, y); });
    g.stroke();
  }
  g.restore();
}

function drawVeins(g, t, b, grow) {
  if (grow < 0.01) return;
  g.globalCompositeOperation = 'lighter'; g.lineCap = 'round';
  const s1 = b.since, s0 = b.since + b.len;   // the two most recent heartbeats travel outward
  const sc = S * (1 + 0.04 * b.pump);
  for (const grp of VEIN_GROUPS) {
    if (!grp.segs.length) continue;
    const d = (grp.b + 0.5) / VBINS;
    if (d > grow) continue;
    const wave = Math.exp(-Math.pow(d - s1 * 0.9, 2) * 70) + 0.6 * Math.exp(-Math.pow(d - s0 * 0.9, 2) * 70);
    const tip = smooth(grow, grow - 0.12, d);
    const a = tip * (0.22 + 0.8 * wave) * Math.min(1, grow * 2);
    g.strokeStyle = hsl(354, 85, 42 + 30 * wave, a);
    g.lineWidth = (grp.c === 2 ? 3 : grp.c === 1 ? 1.8 : 1) * S * (1 + wave * 0.6);
    g.beginPath();
    for (const v of grp.segs) { g.moveTo(CX + v.x0 * sc, CY + v.y0 * sc); g.lineTo(CX + v.x1 * sc, CY + v.y1 * sc); }
    g.stroke();
  }
}

function drawRings(g, t) {
  g.globalCompositeOperation = 'lighter';
  for (let i = rings.length - 1; i >= 0; i--) {
    const r = rings[i], age = t - r.t0;
    if (age < 0 || age > 2.4) { rings.splice(i, 1); continue; }
    const rad = 230 * S + 760 * S * (1 - Math.exp(-age * 2));
    const a = r.a * Math.exp(-age * 2.3);
    g.strokeStyle = hsl(r.hue, r.sat, 70, a * 0.5); g.lineWidth = r.w * S;
    g.beginPath(); g.arc(CX, CY, rad, 0, TAU); g.stroke();
  }
}

function drawCracks(g, t) {
  g.globalCompositeOperation = 'lighter'; g.lineCap = 'round'; g.lineJoin = 'round';
  for (const c of CRACK_AT) {
    if (t < c.t || t > c.a[c.a.length - 1][0]) continue;
    const grow = smooth(c.t, c.t + 0.22, t);
    const flare = c.flare.reduce((s, f) => s + after(t, f, 0.45), 0) + after(t, c.t, 0.5);
    const a = track(c.a, t) * (0.55 + 0.6 * flare);
    const [ox, oy] = L[c.at];
    g.save(); g.translate(ox, oy); g.rotate(c.rot); g.scale(c.sc * S, c.sc * S);
    for (const pass of [0, 1]) {
      g.strokeStyle = pass ? hsl(c.hue, 40, 88, a) : hsl(c.hue, 90, 50, a * 0.35);
      g.lineWidth = (pass ? 1.3 : 5) / c.sc;
      g.beginPath();
      for (const cr of CRACKS) {
        const k = clamp((grow - cr.delay) / (1 - cr.delay + 1e-3));
        const n = Math.ceil(k * (cr.pts.length - 1));
        if (n < 1) continue;
        g.moveTo(cr.pts[0][0], cr.pts[0][1]);
        for (let j = 1; j <= n; j++) g.lineTo(cr.pts[j][0], cr.pts[j][1]);
      }
      g.stroke();
    }
    g.restore();
  }
}

function drawTears(g, t) {
  if (t < 46.6 || t > 51.5) return;
  g.globalCompositeOperation = 'lighter'; g.lineCap = 'round';
  const w = L.win;
  for (let i = 0; i < 64; i++) {
    const r1 = Math.sin(i * 91.7) * 0.5 + 0.5, r2 = Math.sin(i * 17.3) * 0.5 + 0.5, r3 = Math.sin(i * 43.1) * 0.5 + 0.5;
    const t0 = 46.7 + r2 * 2.6, age = t - t0;
    if (age < 0 || age > 1.8) continue;
    const x = w.x + (r1 * 2 - 1) * w.hw * 0.92;
    const y = w.y - w.hh + age * (90 + 140 * r3) * S + age * age * 260 * S;
    const len = (14 + 30 * r3 + age * 30) * S;
    const a = 0.55 * (1 - age / 1.8);
    g.strokeStyle = hsl(205, 70, 82, a); g.lineWidth = 1.6 * S;
    g.beginPath(); g.moveTo(x, y - len); g.lineTo(x, y); g.stroke();
    dot(g, x, y, 4 * S, 205, 70, 85, a);
  }
}

function drawSeek(g, t) {
  for (const [a, b, a0, a1, land, target] of SEEK) {
    if (t < a - 0.2 || t > b + 2.2) continue;
    const ox = CX, oy = H + 60 * S;
    let to = a1, dist = Math.min(H * 0.62, 640 * S);
    if (target === 'child') { const dx = L.child[0] - ox, dy = L.child[1] - oy; to = Math.atan2(dx, -dy); dist = Math.hypot(dx, dy); }
    let vis = smooth(a - 0.2, a + 0.4, t) * (1 - smooth(b + 0.3, b + 1.6, t));
    if (land < 0) vis *= (t > 153.3 && t < 153.5 ? 0.2 : 1) * 0.6;   // flicker, then out
    if (vis < 0.01) continue;
    const ang = lerp(a0, to, smooth(a, b, t)) + 0.02 * Math.sin(u * 3);
    const len = H * 1.4, hw = 0.075;
    const dx = Math.sin(ang), dy = -Math.cos(ang);
    g.globalCompositeOperation = 'lighter';
    const gr = g.createLinearGradient(ox, oy, ox + dx * len, oy + dy * len);
    gr.addColorStop(0, hsl(210, 30, 88, 0.32 * vis)); gr.addColorStop(0.55, hsl(210, 30, 85, 0.12 * vis)); gr.addColorStop(1, hsl(210, 30, 85, 0));
    g.fillStyle = gr;
    g.beginPath(); g.moveTo(ox, oy);
    g.lineTo(ox + Math.sin(ang - hw) * len, oy - Math.cos(ang - hw) * len);
    g.lineTo(ox + Math.sin(ang + hw) * len, oy - Math.cos(ang + hw) * len);
    g.closePath(); g.fill();
    const sx_ = ox + dx * dist, sy_ = oy + dy * dist;
    dot(g, sx_, sy_, 120 * S, 210, 30, 80, 0.22 * vis, true);
    if (land > 0) {
      const k = swell(t, land, 0.15, 1.3);
      if (k > 0.01) {
        // what the light finds: an empty ring where someone should be
        g.setLineDash([7 * S, 9 * S]);
        g.strokeStyle = hsl(210, 25, 92, 0.75 * k); g.lineWidth = 2 * S;
        g.beginPath(); g.arc(sx_, sy_, (34 + 14 * (1 - k)) * S, 0, TAU); g.stroke();
        g.setLineDash([]);
      }
    }
  }
}

function drawFatherhood(g, t, b) {
  const fv = track(TR.father, t);
  if (fv < 0.01) return;
  g.globalCompositeOperation = 'lighter';
  const fh = track(TR.fHue, t), dim = 1 - 0.45 * smooth(105.4, 106.4, t) * (1 - smooth(108, 112, t));
  const [fx, fy] = L.father;
  orb(g, fx, fy, 24 * S * (1 + 0.15 * b.pump), fh, 80, 62, fv * dim);
  // the child: born out of the father's light, drifts out, turns cold
  const kv = track(TR.kid, t);
  if (kv > 0.01) {
    const kh = track(TR.kidHue, t), [kx, ky] = L.kid;
    orb(g, kx, ky, 11 * S * (1 + 0.1 * b.pump), kh, 75, 66, kv);
    // the tether between them thins out as the distance grows
    const teth = kv * fv * (1 - smooth(96.8, 100, t)) * 0.3;
    if (teth > 0.01) { g.strokeStyle = hsl(40, 70, 70, teth); g.lineWidth = 1.2 * S; g.beginPath(); g.moveTo(fx, fy); g.lineTo(kx, ky); g.stroke(); }
    // grandchildren drifting out of reach
    const bk = smooth(99.6, 103.8, t), bv = smooth(98.8, 99.4, t) * (1 - bk) * kv;
    if (bv > 0.01) for (let i = 0; i < 3; i++) {
      const a = i * 2.1 + 0.6;
      orb(g, kx + Math.cos(a) * (28 * S + bk * 640 * S), ky + Math.sin(a) * (22 * S + bk * 420 * S), 5 * S, 42, 70, 70, bv);
    }
  }
  // warmth passed from father to child
  if (t > 92.5 && t < 93.9) {
    const [kx, ky] = L.kid;
    for (let i = 0; i < 3; i++) {
      const k = rnd();
      dot(g, lerp(fx, kx, k) + (rnd() - 0.5) * 8 * S, lerp(fy, ky, k) + (rnd() - 0.5) * 8 * S, 6 * S, 45, 90, 75, 0.6 * fv);
    }
  }
  // a comet he goes after
  const ck = (t - 112.25) / 1.5;
  if (ck > 0 && ck < 1.4) {
    for (let j = 0; j < 26; j++) {
      const k = clamp(ck - j * 0.018, 0, 1), e = 1 - Math.pow(1 - k, 2);
      const x = lerp(-0.08 * W, 1.12 * W, e), y = lerp(0.24 * H, 0.1 * H, e) + Math.sin(e * 5) * 12 * S;
      dot(g, x, y, (16 - j * 0.5) * S, 48, 85, 80, (1 - j / 26) * (1 - smooth(1, 1.4, ck)));
    }
  }
  // regrets: echo rings that never come back
  for (const st of SHOULD) {
    const age = t - snap(st);
    if (age < 0 || age > 2.6) continue;
    g.strokeStyle = hsl(fh, 60, 70, 0.55 * Math.pow(1 - age / 2.6, 2)); g.lineWidth = 2 * S;
    g.beginPath(); g.arc(fx, fy, 40 * S + age * 330 * S, 0, TAU); g.stroke();
  }
  for (const ct of CALLED) for (const off of [0, 0.2]) {
    const age = t - snap(ct) - off;
    if (age < 0 || age > 2) continue;
    g.strokeStyle = hsl(210, 40, 80, 0.5 * Math.pow(1 - age / 2, 2)); g.lineWidth = 1.2 * S;
    g.beginPath(); g.arc(fx, fy, 30 * S + age * 260 * S, 0, TAU); g.stroke();
  }
}

function drawSmoke(g, t, dt) {
  const rate = track(TR.smoke, t);
  smokeAcc += rate * 20 * dt;
  while (smokeAcc >= 1) {
    smokeAcc -= 1;
    puffs.push({ x: CX - 60 * S + (rnd() - 0.5) * 50 * S, y: CY + 210 * S, vx: (rnd() - 0.5) * 24 * S, vy: -(30 + rnd() * 45) * S, r: 16 * S, life: 0, max: 4.5 + rnd() * 3, h: rnd() < 0.65 ? 272 : 150 });
  }
  g.globalCompositeOperation = 'lighter';
  for (let i = puffs.length - 1; i >= 0; i--) {
    const p = puffs[i];
    p.life += dt;
    if (p.life > p.max) { puffs.splice(i, 1); continue; }
    const n = noise2(p.x / (180 * S), p.y / (180 * S) + u * 0.08);
    p.vx += Math.cos(n * TAU * 1.5) * 40 * S * dt;
    p.x += p.vx * dt; p.y += p.vy * dt; p.r += 26 * S * dt;
    dot(g, p.x, p.y, p.r, p.h, 22, 62, 0.11 * Math.sin(Math.PI * p.life / p.max), true);
  }
}

function drawVerse3(g, t, b) {
  g.globalCompositeOperation = 'lighter';
  // his mother's light
  const sv = track(TR.sheila, t);
  if (sv > 0.01) orb(g, CX - 220 * S, CY + 60 * S + Math.sin(u) * 6 * S, 14 * S, 340, 60, 72, sv * (0.85 + 0.15 * Math.sin(u * 1.7)));
  // a warmer light somewhere else, drifting off
  const ov = track(TR.other, t);
  if (ov > 0.01) orb(g, W * 0.12 - smooth(183, 187.4, t) * 240 * S, CY - 140 * S, 16 * S, 330, 70, 70, ov);
  // the empty house
  const hv = track(TR.house, t);
  if (hv > 0.01) {
    const k = track(TR.houseK, t), hx = CX, hy = CY + 40 * S;
    g.save(); g.translate(hx, hy); g.scale(S, S);
    g.lineJoin = 'round'; g.lineCap = 'round';
    for (const pass of [0, 1]) {
      g.strokeStyle = pass ? hsl(205, 25, 82, hv * 0.8) : hsl(205, 50, 60, hv * 0.18 * (1 + 0.5 * b.pump));
      g.lineWidth = pass ? 2 : 8;
      for (const h of HOUSE) {
        g.setLineDash([h.len * k, h.len + 1]);
        g.beginPath(); h.pts.forEach(([x, y], i) => i ? g.lineTo(x, y) : g.moveTo(x, y)); g.stroke();
      }
    }
    g.setLineDash([]);
    // someone coming back - the door warms, but nobody arrives
    const cb = track(TR.comeBack, t);
    if (cb > 0.01) {
      const gr = g.createLinearGradient(0, 170, 0, 40);
      gr.addColorStop(0, hsl(35, 80, 60, 0.35 * cb)); gr.addColorStop(1, hsl(35, 80, 60, 0));
      g.fillStyle = gr; g.fillRect(-42, 40, 84, 130);
    }
    g.restore();
    if (cb > 0.01) {
      const k2 = smooth(177.5, 180.2, t) * 0.72;
      orb(g, lerp(W + 60 * S, hx, k2), lerp(CY + 230 * S, hy + 130 * S, k2), 9 * S, 35, 85, 70, cb);
    }
  }
}

function drawChildhood(g, t, b) {
  g.globalCompositeOperation = 'lighter';
  const cv_ = track(TR.child, t), mv = track(TR.mama, t);
  const fault = 1 - 0.4 * smooth(37.8, 38.7, t) * (1 - smooth(50.5, 51, t));
  const rage = after(t, snap(52.38), 0.5) + after(t, snap(54.72), 0.5);
  if (mv > 0.01) {
    const hit = after(t, snap(50.84), 0.6);
    orb(g, L.mama[0], L.mama[1], 15 * S * (1 + 0.08 * Math.sin(u * 1.3)), lerpHue(345, 0, hit), lerp(55, 90, hit), 70, mv * fault);
  }
  if (cv_ > 0.01) {
    const me = swell(t, 31.02, 0.2, 1);
    orb(g, L.child[0], L.child[1], 9 * S * (1 + 0.1 * Math.sin(u * 1.6) + 0.3 * rage + 0.2 * me), lerpHue(48, 5, clamp(rage)), 70 + 20 * clamp(rage), 72, cv_ * fault);
  }
  // the outro's "oh"s swell around everything
  for (const o of OH) {
    const k = swell(t, o, 0.35, 1.4);
    if (k < 0.01) continue;
    const age = t - o;
    g.strokeStyle = hsl(pal.hue, 35, 80, 0.35 * k); g.lineWidth = 8 * S;
    g.beginPath(); g.arc(CX, CY, 120 * S + age * 230 * S, 0, TAU); g.stroke();
    g.strokeStyle = hsl(pal.hue, 25, 92, 0.5 * k); g.lineWidth = 1.5 * S; g.stroke();
  }
}

// ===== compositing: scene -> screen with optional drunk warp, bloom, flash, vignette, grain =====
function composite(t, bloom, flash, flashHue, warp) {
  ctx.globalCompositeOperation = 'copy'; ctx.globalAlpha = 1;
  if (warp > 0.01) {
    // 'copy' would wipe everything outside each strip, so clear once and draw strips over it
    ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'source-over';
    const sh = Math.max(4, Math.round(6 * DPR));
    for (let y = 0; y < H; y += sh) {
      const f = y / H;
      const dx = warp * S * (16 * Math.sin(f * 9 + u * 2.1) + 7 * Math.sin(f * 23 - u * 3.3));
      ctx.drawImage(scene, 0, y, W, sh, dx, y + warp * 3 * S * Math.sin(u * 1.7 + f * 4), W, sh);
    }
  } else ctx.drawImage(scene, 0, 0);
  g1x.globalCompositeOperation = 'copy'; g1x.drawImage(cv, 0, 0, g1.width, g1.height);
  g2x.globalCompositeOperation = 'copy'; g2x.drawImage(g1, 0, 0, g2.width, g2.height);
  ctx.globalCompositeOperation = 'lighter';
  ctx.globalAlpha = bloom * 0.5; ctx.drawImage(g1, 0, 0, W, H);
  ctx.globalAlpha = bloom; ctx.drawImage(g2, 0, 0, W, H);
  if (warp > 0.01) { ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'soft-light'; ctx.fillStyle = hsl(32, 90, 50, warp * 0.35); ctx.fillRect(0, 0, W, H); }
  if (flash > 0.004) { ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = 1; ctx.fillStyle = hsl(flashHue, 60, 60, Math.min(0.6, flash)); ctx.fillRect(0, 0, W, H); }
  ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
  ctx.drawImage(vig, 0, 0);
  ctx.globalCompositeOperation = 'overlay'; ctx.globalAlpha = 0.07;
  const ox = Math.floor(rnd() * 256), oy = Math.floor(rnd() * 256);
  ctx.save(); ctx.translate(-ox, -oy); ctx.fillStyle = grainPat; ctx.fillRect(ox, oy, W, H); ctx.restore();
  ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
}

function spaced(text, x, y, gap) {
  const ws = [...text].map(c => ctx.measureText(c).width);
  let cx = x - (ws.reduce((a, b) => a + b, 0) + gap * (ws.length - 1)) / 2;
  ctx.textAlign = 'left';
  [...text].forEach((c, i) => { ctx.fillText(c, cx, y); cx += ws[i] + gap; });
  ctx.textAlign = 'center';
}

function drawUI(t) {
  const fs = Math.max(12 * DPR, 15 * S), font = '"Helvetica Neue", Helvetica, Arial, sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const y = Math.min(H - 125 * S, CY + 360 * S);
  if (loadError) {
    ctx.font = `${fs}px ${font}`; ctx.fillStyle = 'rgba(255,200,200,0.9)';
    ctx.fillText(`couldn't load ${SRC} — keep it in the same folder as this page`, CX, y);
    return;
  }
  if (!started) {
    ctx.font = `200 ${fs * 1.7}px ${font}`; ctx.fillStyle = 'rgba(235,230,245,0.85)';
    spaced(TITLE.toUpperCase(), CX, y, fs * 0.9);
    ctx.font = `300 ${fs}px ${font}`; ctx.fillStyle = `rgba(210,210,230,${0.45 + 0.3 * Math.sin(u * 2)})`;
    ctx.fillText(ended ? 'click to play again' : 'click to play', CX, y + fs * 2.4);
    return;
  }
  if (audio.paused) {
    ctx.font = `300 ${fs}px ${font}`; ctx.fillStyle = 'rgba(210,210,230,0.7)';
    ctx.fillText('paused', CX, y + fs * 2.4);
  }
}

const mmss = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
function rrect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y); ctx.arcTo(x + w, y, x + w, y + r, r);
  ctx.lineTo(x + w, y + h - r); ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
  ctx.lineTo(x + r, y + h); ctx.arcTo(x, y + h, x, y + h - r, r);
  ctx.lineTo(x, y + r); ctx.arcTo(x, y, x + r, y, r);
  ctx.closePath();
}

// keyboard legend, top-left; dims while playing until the mouse or a key is used
const LEGEND = [[['Space'], 'Play / pause'], [['←', '→'], 'Skip 10 s'], [['H'], 'Hide keys']];
const UI_FONT = 'system-ui, -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif';
const KEY_H = 22, KEY_R = 5, KEY_FS = 11.5;
const keyW = k => Math.max(KEY_H, ctx.measureText(k).width / DPR + 14) * DPR;
// a keycap: soft raised face, hairline border, darker bottom lip
function keycap(x, cy, k) {
  const w = keyW(k), h = KEY_H * DPR, r = KEY_R * DPR, y = cy - h / 2;
  ctx.fillStyle = 'rgba(0,0,0,0.45)'; rrect(x, y + 1.5 * DPR, w, h, r); ctx.fill();
  const gr = ctx.createLinearGradient(0, y, 0, y + h);
  gr.addColorStop(0, 'rgba(255,255,255,0.17)'); gr.addColorStop(1, 'rgba(255,255,255,0.09)');
  ctx.fillStyle = gr; rrect(x, y, w, h, r); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.16)'; ctx.lineWidth = DPR; rrect(x + 0.5 * DPR, y + 0.5 * DPR, w - DPR, h - DPR, r); ctx.stroke();
  ctx.fillStyle = 'rgba(245,245,252,0.95)'; ctx.textAlign = 'center';
  ctx.fillText(k, x + w / 2, cy + 0.5 * DPR);
  return w;
}
function drawLegend(du) {
  const active = !started || audio.paused || u - ui.moved < 3;
  ui.la = lerp(ui.la, ui.legend ? (active ? 1 : 0.3) : 0, 1 - Math.pow(0.02, du));
  const pad = 20 * DPR, inner = 14 * DPR, row = 30 * DPR, gap = 4 * DPR, colGap = 14 * DPR;
  const keyFont = `500 ${KEY_FS * DPR}px ${UI_FONT}`, textFont = `400 ${12.5 * DPR}px ${UI_FONT}`;
  ctx.textBaseline = 'middle';
  if (ui.la < 0.02) {   // hidden: leave a faint way back
    ctx.globalAlpha = 0.45; ctx.font = keyFont;
    const w = keycap(pad, pad + KEY_H * DPR / 2, 'H');
    ctx.font = textFont; ctx.textAlign = 'left'; ctx.fillStyle = 'rgba(220,220,235,0.8)';
    ctx.fillText('Keys', pad + w + 8 * DPR, pad + KEY_H * DPR / 2);
    ctx.globalAlpha = 1;
    return;
  }
  ctx.font = keyFont;
  const keysW = Math.max(...LEGEND.map(([ks]) => ks.reduce((s, k) => s + keyW(k), 0) + gap * (ks.length - 1)));
  ctx.font = textFont;
  const textW = Math.max(...LEGEND.map(([, d]) => ctx.measureText(d).width));
  const bw = inner * 2 + keysW + colGap + textW, bh = inner * 2 + LEGEND.length * row - (row - KEY_H * DPR);
  ctx.globalAlpha = ui.la;
  ctx.fillStyle = 'rgba(12,10,20,0.6)'; rrect(pad, pad, bw, bh, 12 * DPR); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.08)'; ctx.lineWidth = DPR; rrect(pad + 0.5 * DPR, pad + 0.5 * DPR, bw - DPR, bh - DPR, 12 * DPR); ctx.stroke();
  LEGEND.forEach(([ks, d], i) => {
    const cy = pad + inner + KEY_H * DPR / 2 + i * row;
    ctx.font = keyFont;
    let kx = pad + inner;
    for (const k of ks) kx += keycap(kx, cy, k) + gap;
    ctx.font = textFont; ctx.textAlign = 'left'; ctx.fillStyle = 'rgba(220,220,232,0.78)';
    ctx.fillText(d, pad + inner + keysW + colGap, cy + 0.5 * DPR);
  });
  ctx.globalAlpha = 1;
}

// timeline: chorus spans tinted, playhead knob, times, hover preview; drag to scrub
const CHORUS_SPANS = [[SEC.ch1, SEC.in1], [SEC.ch2, SEC.in2], [SEC.ch3, SEC.outro]];
function drawTimeline(t, du) {
  const b = bar(), dur = songDur(), w = b.x1 - b.x0, X = s => b.x0 + w * clamp(s / dur);
  const pos = clamp((started || ended ? t : 0) / dur);
  // minimised to a hairline unless the cursor comes near the bottom edge (or a scrub is in progress)
  const near = ui.drag || (ui.my >= 0 && ui.my > H - 120 * DPR);
  ui.ex = lerp(ui.ex, near ? 1 : 0, 1 - Math.pow(0.0005, du));
  if (ui.ex < 0.995) {
    ctx.globalAlpha = 1 - ui.ex;
    ctx.fillStyle = 'rgba(255,255,255,0.05)'; ctx.fillRect(0, H - 2 * DPR, W, 2 * DPR);
    ctx.fillStyle = hsl(pal.hue, 40, 70, 0.35); ctx.fillRect(0, H - 2 * DPR, W * pos, 2 * DPR);
    ctx.globalAlpha = 1;
  }
  if (ui.ex < 0.005) return;
  const th = (ui.hover || ui.drag ? 6 : 4) * DPR, font = '"Helvetica Neue", Helvetica, Arial, sans-serif';
  ctx.save();
  ctx.translate(0, (1 - ui.ex) * 14 * DPR);
  ctx.globalAlpha = ui.ex;
  // soft floor so the bar reads over bright frames
  const gr = ctx.createLinearGradient(0, b.top - 20 * DPR, 0, H);
  gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(1, 'rgba(0,0,0,0.55)');
  ctx.fillStyle = gr; ctx.fillRect(0, b.top - 20 * DPR, W, H - b.top + 20 * DPR);
  ctx.fillStyle = 'rgba(255,255,255,0.14)'; rrect(b.x0, b.y - th / 2, w, th, th / 2); ctx.fill();
  ctx.fillStyle = 'rgba(200,40,60,0.35)';
  for (const [a, e] of CHORUS_SPANS) ctx.fillRect(X(a), b.y - th / 2, X(e) - X(a), th);
  const px = X(pos * dur);
  ctx.fillStyle = hsl(pal.hue, 55, 72, 0.95); rrect(b.x0, b.y - th / 2, Math.max(th, px - b.x0), th, th / 2); ctx.fill();
  ctx.beginPath(); ctx.arc(px, b.y, (ui.hover || ui.drag ? 8 : 6) * DPR, 0, TAU);
  ctx.fillStyle = 'rgba(245,242,255,0.95)'; ctx.fill();
  ctx.font = `300 ${11 * DPR}px ${font}`; ctx.textBaseline = 'middle'; ctx.fillStyle = 'rgba(225,225,240,0.8)';
  ctx.textAlign = 'left'; ctx.fillText(mmss(started || ended ? t : 0), b.x0, b.y - 18 * DPR);
  ctx.textAlign = 'right'; ctx.fillText(mmss(dur), b.x1, b.y - 18 * DPR);
  if (ui.hover || ui.drag) {
    const hx = clamp(ui.mx, b.x0, b.x1), label = mmss(clamp((hx - b.x0) / w) * dur);
    ctx.font = `500 ${11 * DPR}px ${font}`;
    const lw = ctx.measureText(label).width + 12 * DPR;
    ctx.fillStyle = 'rgba(10,8,18,0.8)'; rrect(hx - lw / 2, b.y - 40 * DPR, lw, 18 * DPR, 4 * DPR); ctx.fill();
    ctx.fillStyle = 'rgba(245,245,255,0.95)'; ctx.textAlign = 'center'; ctx.fillText(label, hx, b.y - 31 * DPR);
  }
  ctx.restore();
}

// ===== main loop =====
function frame() {
  requestAnimationFrame(frame);
  const now = performance.now() / 1000, du = Math.min(0.1, now - lastU);
  lastU = now; u += du;
  const t = ended ? 238 : songTime();
  let dt = t - lastT;
  if (dt < -0.25 || dt > 0.5) { resync(t); dt = 0; }
  dt = clamp(dt, 0, 0.1);
  lastT = t;

  pal = palette(t);
  layout(t);
  const b = beatAt(t);
  b.pump = Math.exp(-b.since * 9) + (b.since > 0.17 ? 0.55 * Math.exp(-(b.since - 0.17) * 10) : 0);   // lub-dub
  b.pump *= 0.5 + 0.6 * b.acc;
  const energy = 0.5 * env(BASS, t) + 0.5 * env(MID, t);
  const blood = track(TR.blood, t);

  // events crossed since the last frame (skipped when they are stale, e.g. after a seek)
  if (b.i !== beatPtr) { if (b.i === beatPtr + 1 && b.since < 0.2) onBeat(b, t); beatPtr = b.i; }
  while (wordPtr < WORDS.length && WORDS[wordPtr][0] <= t) { if (t - WORDS[wordPtr][0] < 0.3) onWord(WORDS[wordPtr], t); wordPtr++; }
  while (burstPtr < BURSTS.length && BURSTS[burstPtr][0] <= t) { if (t - BURSTS[burstPtr][0] < 0.3) onBurst(BURSTS[burstPtr][1], t); burstPtr++; }
  recRot += dt * 3.49 * track(TR.spin, t);
  coreKick *= Math.pow(0.05, du);

  // camera: breathe with the kick, shake on impacts
  let shake = 0, flash = 0;
  for (const [ti, amp] of IMPACTS) { shake += amp * after(t, ti, 0.22); flash += amp * 0.45 * after(t, ti, 0.1); }
  if (t > 188.45 && t < 190.4) shake += 0.35 * after(b.since, 0, 0.06);
  flash += blood * b.pump * (b.down ? 0.06 : 0.025) * env(BASS, t);
  const zoom = 1 + 0.018 * b.pump * (0.3 + blood) + 0.012 * env(BASS, t) * blood;
  const shx = shake * 18 * S * noise2(u * 23, 1.3), shy = shake * 18 * S * noise2(7.1, u * 23);

  // background layer
  drawSky(sx, t, b);
  sx.setTransform(zoom, 0, 0, zoom, CX - CX * zoom + shx, CY - CY * zoom + shy);
  drawStars(sx, t, track(TR.stars, t));
  drawRays(sx, t, track(TR.rays, t));
  drawMoon(sx, t, track(TR.moon, t), b);
  drawWindow(sx, track(TR.window, t));
  drawRecord(sx, t, b, track(TR.record, t), blood);
  drawVeins(sx, t, b, track(TR.veins, t));
  drawRings(sx, t);
  drawSmoke(sx, t, dt);
  drawVerse3(sx, t, b);
  drawSeek(sx, t);
  drawCracks(sx, t);
  drawCross(sx, t);
  drawChildhood(sx, t, b);
  drawFatherhood(sx, t, b);
  drawTears(sx, t);
  drawDust(sx, du, t, energy, blood);
  sx.setTransform(1, 0, 0, 1, 0, 0);

  // particle layer with motion trails
  tx.globalCompositeOperation = 'destination-out';
  tx.globalAlpha = 1 - Math.pow(0.72, du * 60);
  tx.fillRect(0, 0, W, H);
  tx.globalAlpha = 1;
  updateParticles(tx, dt);
  sx.globalCompositeOperation = 'lighter'; sx.globalAlpha = 1;
  sx.drawImage(trail, 0, 0);
  sx.globalCompositeOperation = 'source-over';

  composite(t, 0.5 + 0.35 * blood + 0.25 * b.pump * blood + 0.3 * coreKick, flash, pal.hue, track(TR.warp, t));
  drawUI(t);
  if (started && t > 5 && !ui.autoHidden) { ui.autoHidden = true; ui.legend = false; }   // fold the legend away once playback is underway
  if (!loadError) { drawTimeline(t, du); drawLegend(du); }
}

addEventListener('resize', resize);
resize();
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
